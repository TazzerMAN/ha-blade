version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    # Pinned to the versions the targeted Home Assistant release ships; they move with homeassistant.
    ignore:
      - dependency-name: hassil
      - dependency-name: home-assistant-intents
      - dependency-name: gazetteer-matcher
      - dependency-name: mutagen
      - dependency-name: ha-ffmpeg
      - dependency-name: SQLAlchemy
      - dependency-name: fnv-hash-fast
      - dependency-name: pymicro-vad
      - dependency-name: pyspeex-noise
      - dependency-name: PyTurboJPEG
      - dependency-name: av
      - dependency-name: numpy
    groups:
      python:
        patterns: ["*"]
