[project]
name = "ha-blade"
version = "1.0.0"
description = "Home Assistant integration for the Blade inference API"
requires-python = ">=3.14.2"
license = "Apache-2.0"

[dependency-groups]
dev = [
    "homeassistant==2026.11.1",
    "pytest-homeassistant==2026.11.1",
    "pytest-cov",
    # Requirements of the HA components Blade loads in tests.
    "hassil==3.12.1",
    "home-assistant-intents==2026.10.27",
    "gazetteer-matcher==1.1.0",
    "mutagen==1.48.1",
    "ha-ffmpeg==3.2.2",
    "SQLAlchemy==2.0.54",
    "fnv-hash-fast==2.0.3",
    "pymicro-vad==1.0.1",
    "pyspeex-noise==1.0.2",
    "PyTurboJPEG==1.8.3",
    "av==19.0.0",
    "numpy==2.3.2",
    "mypy",
    "ruff",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
# Let Home Assistant install its httpx alias before respx is imported.
addopts = "-p no:respx --strict-markers"

[tool.coverage.run]
source = ["custom_components.blade"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = ["if TYPE_CHECKING:"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", "D203", "D213", "ISC001", "TRY003", "EM101", "EM102",
    "PLR0913", "ANN401", "FBT001", "FBT002", "BLE001",
    # Home Assistant conventions: fixed platform signatures, _attr_ class lists,
    # runtime-evaluated annotations, no per-file copyright header.
    "ARG001", "ARG002", "RUF012", "TC002", "TC003", "CPY001",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101", "PLR2004", "SLF001", "ARG001", "D103", "INP001", "PLR0917", "FBT003",
]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
disallow_any_generics = true
plugins = []
mypy_path = "."
explicit_package_bases = true
