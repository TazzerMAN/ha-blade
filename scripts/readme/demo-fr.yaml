homeassistant:
  name: Maison
  language: fr
  country: FR
  time_zone: Europe/Paris
  unit_system: metric
  currency: EUR
frontend:
config:
conversation:
assist_pipeline:
history:
logbook:
media_source:
person:
sun:
system_health:
input_boolean:
  lamp_relay:
    name: Relay
template:
  - light:
      - name: Lampe du salon
        unique_id: demo_lamp
        state: "{{ is_state('input_boolean.lamp_relay', 'on') }}"
        turn_on:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.lamp_relay
        turn_off:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.lamp_relay
